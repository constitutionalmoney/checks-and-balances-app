packages:
  - apps/*
  - packages/*

allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - tsx@4.23.15

overrides:
  "@nestjs/platform-fastify>fastify": 5.12.7
  deepmerge-ts: 8.0.2
  find-my-way: 9.7.0
  js-yaml: 5.5.0
  nanoid: 3.3.18
  vite: 8.3.5
  postcss: 8.5.31
  "prisma>mysql2": 3.23.1
