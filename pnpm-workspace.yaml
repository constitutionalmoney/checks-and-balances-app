packages:
  - apps/*
  - packages/*

allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - tsx@4.23.9

overrides:
  deepmerge-ts: 8.0.0
  find-my-way: 9.7.0
  js-yaml: 5.2.2
  nanoid: 3.3.18
